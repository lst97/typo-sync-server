name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-deno-api:
    name: Test Deno API
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Deno
      uses: denoland/setup-deno@v1
      with:
        deno-version: v1.x
    
    - name: Cache Deno dependencies
      run: cd api && deno cache deps.ts
    
    - name: Run Deno tests
      run: cd api && deno task test
      
    - name: Generate coverage report
      run: cd api && deno task coverage:report
      
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./api/coverage.lcov
        flags: deno-api
        name: deno-api-coverage

  test-python-engine:
    name: Test Python Engine
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libsndfile1
    
    - name: Install Python dependencies
      run: |
        cd rhythm_engine
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install coverage pytest
    
    - name: Run Python tests
      run: |
        cd rhythm_engine
        python test_run.py
        
    - name: Run tests with coverage
      run: |
        cd rhythm_engine
        coverage run --source=app test_run.py
        coverage xml
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./rhythm_engine/coverage.xml
        flags: python-engine
        name: python-engine-coverage

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-deno-api, test-python-engine]
    
    services:
      redis:
        image: redis:alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Deno
      uses: denoland/setup-deno@v1
      with:
        deno-version: v1.x
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libsndfile1
    
    - name: Install Python dependencies
      run: |
        cd rhythm_engine
        pip install -r requirements.txt
    
    - name: Cache Deno dependencies
      run: cd api && deno cache deps.ts
    
    - name: Run integration tests (Redis)
      env:
        REDIS_URL: redis://localhost:6379/0
      run: |
        cd api
        deno test --allow-all tests/integration_test.ts
        
    - name: Run integration tests (In-Memory)
      run: |
        cd api
        deno test --allow-all tests/integration_test.ts

  docker-test:
    name: Docker Integration Test
    runs-on: ubuntu-latest
    needs: [integration-test]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker images
      run: |
        docker-compose -f docker-compose.yml build
        
    - name: Run Docker services
      run: |
        docker-compose -f docker-compose.yml up -d
        sleep 30  # Wait for services to start
        
    - name: Test API health endpoint
      run: |
        curl -f http://localhost:8000/ || exit 1
        
    - name: Test API documentation
      run: |
        curl -f http://localhost:8000/docs || exit 1
        
    - name: Cleanup
      run: |
        docker-compose -f docker-compose.yml down