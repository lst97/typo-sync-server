services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
    env_file:
      - ./.env
    depends_on:
      - redis
  worker:
    build: .
    command: celery -A app.worker worker --loglevel=info
    volumes:
      - ./app:/app
    env_file:
      - ./.env
    depends_on:
      - redis
  redis:
    image: "redis:alpine"
